[tox]
min_version = 4.25.0
envlist = min,py3{11-15},asyncio,asyncio-min,scrapy-unreleased,mypy,docs
requires =
    pip>=25.3
    sphinx-scrapy==0.15.0

[testenv]
deps =
    pytest
    pytest-cov >= 7.0.0
    pytest-twisted
    Twisted
setenv =
    REACTOR=asyncio
commands =
    pytest \
        --cov-config=pyproject.toml --cov-report=term --cov-report=html --cov-report= --cov-report=xml --cov=scrapy_poet \
        --doctest-modules \
        --reactor=asyncio \
        {posargs:scrapy_poet tests}

[pinned]
basepython = python3.11
deps =
    {[testenv]deps}
    andi==0.6.0
    attrs==22.1.0
    # pin older cssselect for old parsel
    cssselect==1.2.0
    parsel==1.5.0
    sqlitedict==1.5.0
    time_machine==2.7.1
    url-matcher==0.4.0
    web-poet==0.25.0

    # https://github.com/john-kurkowski/tldextract/issues/305
    tldextract<3.6

[testenv:min]
basepython = {[pinned]basepython}
setenv =
    REACTOR=
deps =
    {[pinned]deps}
    scrapy==2.13.3
    Twisted==21.7.0

[testenv:default-reactor]
setenv =
    REACTOR=
commands =
    {[testenv]commands} --reactor=default
deps =
    {[testenv]deps}

[testenv:asyncio-min]
basepython = {[pinned]basepython}
commands =
    {[testenv]commands}
deps =
    {[testenv:min]deps}

[testenv:scrapy-unreleased]
deps =
    {[testenv]deps}
    scrapy @ git+https://github.com/scrapy/scrapy@master

[testenv:mypy]
deps =
    mypy==1.19.1
    andi==0.9.0
    attrs==26.1.0
    parsel==1.12.1
    pytest==9.0.2
    scrapy==2.20.0
    sqlitedict==2.1.0
    time_machine==3.5.1
    Twisted==26.4.0
    url-matcher==0.6.0
    web-poet==0.25.0

commands = mypy scrapy_poet tests

[testenv:linters]
deps = -rrequirements-dev.txt
commands = pre-commit run --all-files --show-diff-on-failure

[testenv:twinecheck]
basepython = python3
deps =
    twine==7.0.0
    build==1.4.0
commands =
    python -m build --sdist
    twine check dist/*
